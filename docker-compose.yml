services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetexpense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: ${POSTGRES_DB:-fleetexpense}
    ports:
      # Host 5433 evita colisión con Postgres local en 5432
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleetexpense}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetexpense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:-fleet}@postgres:5432/${POSTGRES_DB:-fleetexpense}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-api-key-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fleetexpense.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - '3000:3000'

volumes:
  pgdata:
